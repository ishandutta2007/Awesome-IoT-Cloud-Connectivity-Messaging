<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#161b22"/><stop offset="100%" stop-color="#0a0d12"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".3"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".05"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{transform:scale(.95);opacity:.3}}@keyframes moveParticle{0%{cx:100;cy:60;opacity:.2}50%{cx:600;cy:260;opacity:.8}}@keyframes moveParticle2{0%{cx:1100;cy:240;opacity:.2}50%{cx:500;cy:80;opacity:.7}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:44px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8;letter-spacing:1px;text-transform:uppercase}.signal-line{stroke:url(#accent-grad);stroke-width:2;stroke-dasharray:8 12;animation:dash 25s linear infinite;opacity:.35}.pulse-node{animation:pulse 3s ease-in-out infinite alternate}.pulse-node-2{animation:pulse 4s ease-in-out infinite alternate 1.5s}.data-particle{animation:moveParticle 8s linear infinite}.data-particle-2{animation:moveParticle2 12s linear infinite 2s}</style><rect width="1200" height="320" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" rx="16"/><g fill="none"><path d="M 80 80 Q 300 20 600 160 T 1120 100" class="signal-line"/><path d="M 100 240 Q 400 300 700 120 T 1100 250" class="signal-line"/><path d="M 200 40 Q 500 220 900 60 T 1000 280" class="signal-line"/><circle cx="150" cy="80" r="40" fill="url(#glow-grad)" class="pulse-node"/><circle cx="150" cy="80" r="5" fill="#38bdf8" filter="url(#glow)"/><circle cx="1050" cy="220" r="50" fill="url(#glow-grad)" class="pulse-node-2"/><circle cx="1050" cy="220" r="6" fill="#c084fc" filter="url(#glow)"/><circle cx="950" cy="80" r="35" fill="url(#glow-grad)" class="pulse-node"/><circle cx="950" cy="80" r="4" fill="#818cf8" filter="url(#glow)"/><circle cx="100" cy="60" r="4" fill="#38bdf8" class="data-particle" filter="url(#glow)"/><circle cx="1100" cy="240" r="3.5" fill="#c084fc" class="data-particle-2" filter="url(#glow)"/></g><g transform="translate(80, 75)"><rect width="310" height="28" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="14"/><text x="16" y="18" class="badge-text">📶 IoT Cloud &amp; Edge Messaging</text><text x="0" y="82" class="title">Awesome IoT Cloud Connectivity</text><rect width="530" height="4" x="0" y="98" fill="url(#accent-grad)" rx="2"/><text x="0" y="132" class="subtitle">Curated SaaS Platforms, MQTT Brokers, Protocols &amp; Open-Source Projects</text></g></svg>